name: build-tep

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Px-asen/Twilight_Echo
          ref: Pxasen
          path: .twilight-echo

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packer dependency
        run: npm install

      - name: Pack with the official Twilight Echo CLI
        env:
          TE_CLI: .twilight-echo/packages/create-twilight-plugin/bin/create-twilight-plugin.cjs
        run: node scripts/pack.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: te-powerpulse
          path: dist/*.tep
          if-no-files-found: error

      - name: Locate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        run: |
          path="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$path" ]; then
            echo "Missing release notes: $path" >&2
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tep
          body_path: ${{ steps.notes.outputs.path }}
          overwrite_files: true
